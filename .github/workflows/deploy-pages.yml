name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write
  actions: read
  pull-requests: write    # 能在 PR 上显示检查状态

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ====== PR 和安全扫描（push 和 PR 都运行）======

  # CodeQL 安全代码分析
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 依赖安全审查
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # 依赖审计
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Playwright 测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run tests
        run: npx playwright test
        env:
          CI: true

  # ====== 版本打标（仅 push master）======

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [codeql, dependency-review, audit, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read VERSION file
        id: read-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check-tag
        run: |
          TAG="v$(cat VERSION)"
          if git fetch --tags origin "$TAG" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="v$(cat VERSION)"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ====== 构建 + 部署 Pages（仅 push main）======

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tag, codeql, dependency-review, audit, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Create .env from secrets
        run: |
          echo "VITE_ABS_SERVER=${{ secrets.ABS_SERVER }}" >> .env
          echo "VITE_ABS_USERNAME=${{ secrets.ABS_USERNAME }}" >> .env
          echo "VITE_ABS_PASSWORD=${{ secrets.ABS_PASSWORD }}" >> .env
        continue-on-error: true

      - name: Set base path
        run: echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
