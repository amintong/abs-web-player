name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      # 构建时注入 .env 配置（通过 GitHub Secrets）
      # 也可在部署后由用户在登录页手动录入，此时无需配置 Secrets
      - name: Create .env from secrets
        run: |
          echo "VITE_ABS_SERVER=${{ secrets.ABS_SERVER }}" >> .env
          echo "VITE_ABS_USERNAME=${{ secrets.ABS_USERNAME }}" >> .env
          echo "VITE_ABS_PASSWORD=${{ secrets.ABS_PASSWORD }}" >> .env
        continue-on-error: true

      # 如果部署到子路径（如 username.github.io/audiobookshelf-player），设置 base path
      - name: Set base path
        run: echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
