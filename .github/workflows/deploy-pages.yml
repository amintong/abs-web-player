name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write   # CodeQL 需要写安全事件
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ====== 1. 版本打标 ======
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: read-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          TAG="v$(cat VERSION)"
          if git fetch --tags origin "$TAG" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="v$(cat VERSION)"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ====== 2. 安全扫描 ======
  security:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2a. CodeQL 代码分析（检测安全漏洞）
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 2b. 依赖漏洞扫描
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # 2c. npm audit 依赖审计
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ====== 3. 构建 + 部署 ======
  build-and-deploy:
    needs: [tag, security]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      # 注入 GitHub Secrets 作为构建时的 .env（可选）
      - name: Create .env from secrets
        run: |
          echo "VITE_ABS_SERVER=${{ secrets.ABS_SERVER }}" >> .env
          echo "VITE_ABS_USERNAME=${{ secrets.ABS_USERNAME }}" >> .env
          echo "VITE_ABS_PASSWORD=${{ secrets.ABS_PASSWORD }}" >> .env
        continue-on-error: true

      - name: Set base path
        run: echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - run: npm run build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
