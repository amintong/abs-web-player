name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write    # 需要写权限来创建 tag
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: read-version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          TAG="v$(cat VERSION)"
          if git fetch --tags origin "$TAG" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="v$(cat VERSION)"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build-and-deploy:
    needs: tag
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      # 注入 GitHub Secrets 作为构建时的 .env（可选）
      # 如果未配置 Secrets，用户可在登录页手动录入服务器信息
      - name: Create .env from secrets
        run: |
          echo "VITE_ABS_SERVER=${{ secrets.ABS_SERVER }}" >> .env
          echo "VITE_ABS_USERNAME=${{ secrets.ABS_USERNAME }}" >> .env
          echo "VITE_ABS_PASSWORD=${{ secrets.ABS_PASSWORD }}" >> .env
        continue-on-error: true

      - name: Set base path
        run: echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV

      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
